  its number because the criterion pairs it with a budget and a named failure
  mode, which is what makes a number checkable.

  The exception counts in A1, A2 and D1 are left as written and are the weakest
  figures in the file for a reason stated in T-0008: a count of exceptions varies
  with the trace cap used to observe it, tens of thousands capped against over a
  million untrapped. They are cited as evidence that a storm happened, which they
  support, and not as quantities anything must reproduce. Every demand attached to
  them is a signature — a console that is not empty, a machine that stopped by
  itself — and that is the right instrument.

ONE OTHER CRITERION HAS THE SAME SHAPE, AND IT IS LEFT STANDING.

  A2 asks for a number: 'state the new boundary in bytes — the overrun depth at
  which the machine stops stopping'. It is satisfiable, because of the clause
  permitting a submission to report that no boundary was found and how far it
  went, and that clause is the only thing keeping it from being B2 again. The
  defect it shares with B2 is the shape: a single number is asked of a harness
  the criterion never asks anyone to audit, over a 64 KiB domain sampled at three
  points, and the number arrives looking like a boundary when it is a sample.

  That is not hypothetical. The depth-injection harness this criterion drives has
  been wrong twice, for two unrelated reasons — a writer destroyed by its own
  writes reported the address where it died rather than the depth it was asked
  for, and its replacement counted from a stack floor read out of a previous
  build while the probe it added moved that floor. Eight figures were corrected
  one at a time across four cycles and the instrument itself stayed unexamined.
  T-0008 already carries that as a BLOCKED criterion, which is where the fix
  belongs; rewording A2 on a task already claimed would change what a submitted
  contribution is measured against for a criterion that, unlike B2, can at least
  be answered honestly as written.

  The general form, recorded once so it is not rediscovered one cycle at a time. A
  criterion that demands a count gets a count, and a count carries none of the
  three things that would let a reader check it: the domain it was taken over,
  the instrument that produced it, and the identity it should satisfy. None of
  the three is recoverable from the number afterwards. Every well-formed number
  in this file has at least one of them attached — the nano image size has a
  budget and a named failure mode, minting-sites has a stated blindness and a
  REVIEW standing behind it, the 160-bit reach-around is derived three ways and
  cross-checked against the RFC. B2 had none of them, and that is why it could
  return zero and mean nothing. Where a count is the natural answer, state the
  domain, name the instrument, and give the arithmetic the count must satisfy;
  where it is not, ask for the signature instead.

WHAT I LEFT OUT OF THIS TASK, AND WHO OWNS IT.

