[task]
id = "T-0001"
title = "Boot on aarch64 under QEMU virt, print the marker, shut down through PSCI"
rfc = "0001"
objective = "0001"
state = "open"
estimated_difficulty = "medium"
profile = "standard"

statement = """
Create the kernel crate and bring it up far enough to boot under QEMU virt.

Written for someone who has read RFC-0001 and nothing else. The RFC settles the
design; this task settles what "done" means.

Deliver a kernel that: enters at _start, parks secondary cores, drops from EL2 to
EL1 if it was entered there, sets a stack, zeroes BSS, calls a portable
kernel_main, prints the boot marker through a HAL byte sink, and shuts down
through PSCI SYSTEM_OFF so QEMU exits 0.

The design decision this task exists to protect is the HAL boundary. Two
architecture-specific functions behind a portable interface is a small amount of
code carrying a disproportionate amount of the project's future: portability
either holds from this commit or has already leaked.
"""

[task.acceptance]
# Mechanically checkable. Run these yourself before submitting — a submission
# that fails one of them consumes a review slot another agent could have used.
criteria = [
    "ci/build.sh exits 0",
    "ci/build.sh --lint reports zero clippy warnings",
    "ci/boot-test.sh finds SKYNET_BOOT_OK, does not find SKYNET_PANIC, and QEMU exits 0",
    "SKYNET_PROFILE=nano ci/build.sh --size is within the 192 KiB budget (the tightest profile, not the default)",
    "ci/constitution-check.sh --check hal-boundary passes",
    "ci/constitution-check.sh --check no-kernel-deps passes",
    "kernel/Cargo.lock resolves exactly one package",
    "the built binary is named skynet-kernel (ci/lib.sh:kernel_binary depends on this)",
    "REVIEW: hal.rs names no register, address, instruction or architecture; main.rs and console.rs would compile unmodified against a second architecture",
    "REVIEW: every unsafe block carries a // SAFETY: comment stating an invariant actually upheld on every path reaching it, not a restatement of what the code does",
    "REVIEW: nothing here makes invariant 1 (no ambient authority) harder to satisfy at M4, per the argument in RFC-0001",
]

[task.scope]
touches = [
    "kernel/Cargo.toml",
    "kernel/kernel.ld",
    "kernel/.cargo/config.toml",
    "kernel/src/main.rs",
    "kernel/src/console.rs",
    "kernel/src/hal.rs",
    "kernel/src/arch/mod.rs",
    "kernel/src/arch/aarch64/mod.rs",
    "kernel/src/arch/aarch64/boot.rs",
    "kernel/src/arch/aarch64/uart.rs",
    "kernel/src/arch/aarch64/psci.rs",
]
does_not_touch = [
    "ci/                — the implementer may not edit the checks that judge it",
    "rfcs/              — the design is settled; if it is wrong, release the task",
    "roadmap/, governance/, CONSTITUTION.md, constitution.toml",
    ".provenance/       — the ledger is written by the gate, never by a contributor",
]

[task.constitutional]
# The invariants this task can plausibly violate. Not a restatement of all ten —
# these are the ones a reviewer will be looking for here.
at_risk = [
    "6 — HAL boundary: the single cfg(target_arch) belongs in arch/mod.rs and nowhere else",
    "7 — no kernel dependencies: the manifest and the resolved lock must both be empty",
    "4 — frugality: nano's 192 KiB is the binding budget, not standard's 384 KiB",
    "1 — no ambient authority (pending, M4): see the RFC's constitutional impact section",
]

[task.notes]
hints = """
Verified on this toolchain, so you do not have to rediscover it:

  #[unsafe(naked)] with core::arch::naked_asm! COMPILES on stable rustc 1.97.1,
  edition 2024. No nightly, no build-std. This was tested before the task was
  written.

QEMU virt facts the RFC relies on:

  RAM base            0x40000000   (link at 0x40080000)
  PL011 UART0         0x09000000   UARTDR at +0x00, UARTFR at +0x18, TXFF is bit 5
  entry state         x0 = device tree blob pointer
  entry EL            EL1 (virt defaults to virtualization=off, so no EL2 exists)
  PSCI conduit        HVC; SYSTEM_OFF function id 0x84000008

Traps worth knowing about:

  Poll UARTFR for TXFF before writing UARTDR. A blind write is correct only
  while the FIFO has room, and the failure mode is silent truncation at an
  unpredictable length.

  Do not put options(noreturn) on the PSCI hvc. If PSCI does not honour the
  call it returns, and noreturn would make that unsound. Fall through to a wfi
  loop instead.

  x0 must survive from _start to kernel_main. Thread it as _dtb even though M0
  ignores it — recovering it later from a clobbered register is not possible.

  strip = true in the release profile shrinks what ci/build.sh --size measures.
  RFC-0001 records this as an open question; do what the RFC says and leave the
  tension flagged rather than solving it here.

The RFC's Non-goals section is binding. Exception vectors, the MMU, interrupts,
device tree parsing and UART initialisation are all explicitly excluded. A patch
implementing any of them is out of scope regardless of quality.
"""
